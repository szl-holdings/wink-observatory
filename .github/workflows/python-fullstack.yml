name: WINK Python fullstack CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Existing WINK data contract
        run: python backend/validate.py
      - name: Evidence and training gates
        run: python -B -m unittest discover -s tests -p 'test_python_observatory.py' -v
      - name: Syntax and whitespace
        run: |
          python -B -m compileall -q backend app.py tests
          git diff --check
  python-service:
    runs-on: ubuntu-latest
    needs: source-contracts
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install exact top-level Python runtime
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
      - name: Boot all-Python UI and ASGI app (no provider calls)
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from unittest.mock import patch
          from backend.api import app
          from backend import live_data
          from backend.ui import worm_figure
          assert len(worm_figure([{"name":"test","status":"parked"}]).data) == 2
          with patch("backend.api.snapshot", return_value=live_data.mirror()):
              client=TestClient(app)
              assert client.get("/healthz").status_code == 200
              r=client.get("/readyz")
              assert r.status_code == 503 and not r.json()["scientific_ready"]
              r=client.get("/api/v1/observatory")
              assert r.status_code == 200 and not r.json()["signature_verified"]
              assert client.get("/api/v1/training").json()["decision"] == "HOLD"
              assert client.get("/api/v1/compute").json()["gpu_job_launched"] is False
              assert client.get("/api/v1/build-info").json()["independent_runtime_verified"] is False
          print("OK: Python UI/ASGI, read-only API, truthful unavailable science")
          PY
